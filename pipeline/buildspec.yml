version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $(echo $WEB_REPO_URI | cut -d'/' -f1)
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-8)
      - echo "Building with image tag $IMAGE_TAG"

  build:
    commands:
      - echo Building web image...
      - docker build -t $WEB_REPO_URI:$IMAGE_TAG -t $WEB_REPO_URI:latest ./app/web
      - echo Building worker image...
      - docker build -t $WORKER_REPO_URI:$IMAGE_TAG -t $WORKER_REPO_URI:latest ./app/worker

  post_build:
    commands:
      - echo Pushing images to ECR...
      - docker push $WEB_REPO_URI:$IMAGE_TAG
      - docker push $WEB_REPO_URI:latest
      - docker push $WORKER_REPO_URI:$IMAGE_TAG
      - docker push $WORKER_REPO_URI:latest
      - echo Writing image definitions for ECS deploy actions...
      - printf '[{"name":"web","imageUri":"%s"}]' "$WEB_REPO_URI:$IMAGE_TAG" > imagedefinitions-web.json
      - printf '[{"name":"worker","imageUri":"%s"}]' "$WORKER_REPO_URI:$IMAGE_TAG" > imagedefinitions-worker.json
      - cat imagedefinitions-web.json
      - cat imagedefinitions-worker.json

artifacts:
  files:
    - imagedefinitions-web.json
    - imagedefinitions-worker.json